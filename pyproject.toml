[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-workflow-mcp"
version = "0.3.1"
description = "Deterministic validation & state layer for the Anki flashcard generation workflow (MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=2.12",
    "pydantic>=2.8",
    "filelock>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
anki-workflow-mcp = "anki_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# RUF001/RUF003: travessão en-dash (–) é tipografia pt-BR intencional nas faixas e rótulos.
ignore = ["E501", "RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
