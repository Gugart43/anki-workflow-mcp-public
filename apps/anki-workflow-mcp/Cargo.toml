[package]
name = "anki-workflow-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "anki-workflow-mcp"

[[bin]]
name = "anki-workflow-mcp"
path = "src/main.rs"

[[bin]]
name = "export-schemas"
path = "src/bin/export_schemas.rs"

[lints]
workspace = true

[features]
default = []
oracle = []

[dependencies]
sha2 = "0.11"
hex = "0.4"
fs2 = "0.4"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled", "collation", "backup"] }
schemars = "1"
anki-domain = { path = "../../crates/anki-domain" }
anki-parser = { path = "../../crates/anki-parser" }
anki-validate = { path = "../../crates/anki-validate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.10.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
