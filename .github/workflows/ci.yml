name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mcp_contract: ${{ steps.filter.outputs.mcp_contract }}
      contracts: ${{ steps.filter.outputs.contracts }}
      npm: ${{ steps.filter.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            mcp_contract:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/anki-workflow-mcp/**'
              - 'crates/**'
              - 'tests/mcp-contract-ts/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/anki-domain/**'
              - 'crates/anki-validate/**'
              - 'apps/anki-workflow-mcp/**'
              - 'contracts/v2/**'
              - 'tools/codegen-ts/**'
              - '.github/workflows/ci.yml'
            npm:
              - 'npm/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Rust toolchain channel (rust-toolchain.toml)
        id: rust_toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/.*channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Verify Rust toolchain matches rust-toolchain.toml
        shell: bash
        run: |
          rustc --version --verbose
          cargo --version
          EXPECTED="${{ steps.rust_toolchain.outputs.channel }}"
          case "$(rustc --version)" in
            "rustc $EXPECTED "*|"rustc $EXPECTED"*) ;;
            *)
              echo "::error::rustc does not match rust-toolchain.toml channel '$EXPECTED': $(rustc --version)"
              exit 1
              ;;
          esac

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build binary for parity / MCP contract
        run: cargo build --locked --features oracle -p anki-workflow-mcp

      - name: Upload Linux Rust binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anki-workflow-mcp-linux-debug
          path: target/debug/anki-workflow-mcp
          retention-days: 1
          if-no-files-found: error

      - name: Upload Windows Rust binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anki-workflow-mcp-windows-debug
          path: target/debug/anki-workflow-mcp.exe
          retention-days: 1
          if-no-files-found: error

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint (ruff)
        run: uv run --locked ruff check src tests scripts

      - name: Typecheck (mypy)
        run: uv run --locked mypy src

      - name: Unit & integration tests (non-differential)
        run: uv run --locked pytest --ignore=tests/differential

      - name: Theme regression checks (AnkiMBR CSS v2 bridge)
        run: uv run --locked python tests/theme_regression_checks.py

  parity:
    name: Parity (ubuntu-latest)
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Rust binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anki-workflow-mcp-linux-debug
          path: target/debug

      - name: Mark binary executable
        run: chmod +x target/debug/anki-workflow-mcp

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Differential parity tests
        env:
          ANKI_RUST_BIN: ${{ github.workspace }}/target/debug/anki-workflow-mcp
        run: uv run --locked pytest tests/differential/

  mcp-contract-ts:
    name: MCP Contract TS (${{ matrix.os }})
    needs: [changes, rust]
    if: ${{ needs.rust.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.mcp_contract == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Rust binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anki-workflow-mcp-linux-debug
          path: target/debug

      - name: Download Rust binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anki-workflow-mcp-windows-debug
          path: target/debug

      - name: Mark binary executable
        if: matrix.os == 'ubuntu-latest'
        run: chmod +x target/debug/anki-workflow-mcp

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: tests/mcp-contract-ts/pnpm-lock.yaml

      - name: Install TS contract dependencies (frozen)
        working-directory: tests/mcp-contract-ts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck and run TS MCP E2E contract tests (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: tests/mcp-contract-ts
        env:
          ANKI_MCP_BIN: ${{ github.workspace }}/target/debug/anki-workflow-mcp
        run: pnpm run check

      - name: Typecheck and run TS MCP E2E contract tests (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: tests/mcp-contract-ts
        env:
          ANKI_MCP_BIN: ${{ github.workspace }}/target/debug/anki-workflow-mcp.exe
        run: pnpm run check

  schema-drift:
    name: Schema Drift (ubuntu-latest)
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Rust toolchain channel (rust-toolchain.toml)
        id: rust_toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/.*channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Print rustc version
        shell: bash
        run: rustc --version --verbose

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: tools/codegen-ts/pnpm-lock.yaml

      - name: Export Rust JSON Schemas
        run: cargo run --locked -p anki-workflow-mcp --bin export-schemas

      - name: Install codegen-ts dependencies, run tests, and check
        working-directory: tools/codegen-ts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run check
          node generate.mjs --check

      - name: Fail on schema or TypeScript contract drift
        shell: bash
        run: |
          git diff --exit-code -- contracts/v2/
          test -z "$(git status --porcelain -- contracts/v2/)"

  npm:
    name: NPM Launcher (${{ matrix.os }})
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.npm == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run NPM launcher tests
        shell: bash
        run: node --test npm/test/*.test.mjs

  test:
    name: Test (${{ matrix.os }})
    # Protected required check aggregate (fail-closed)
    needs: [changes, rust, python, parity, mcp-contract-ts, schema-drift, npm]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Require all applicable jobs to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MCP_CONTRACT_CHANGED: ${{ needs.changes.outputs.mcp_contract }}
          CONTRACTS_CHANGED: ${{ needs.changes.outputs.contracts }}
          NPM_CHANGED: ${{ needs.changes.outputs.npm }}
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PARITY_RESULT: ${{ needs.parity.result }}
          MCP_CONTRACT_TS_RESULT: ${{ needs.mcp-contract-ts.result }}
          SCHEMA_DRIFT_RESULT: ${{ needs.schema-drift.result }}
          NPM_RESULT: ${{ needs.npm.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$PARITY_RESULT" = "success"
          if [ "$EVENT_NAME" = "push" ] || [ "$MCP_CONTRACT_CHANGED" = "true" ]; then
            test "$MCP_CONTRACT_TS_RESULT" = "success"
          else
            test "$MCP_CONTRACT_TS_RESULT" = "success" -o "$MCP_CONTRACT_TS_RESULT" = "skipped"
          fi
          if [ "$EVENT_NAME" = "push" ] || [ "$CONTRACTS_CHANGED" = "true" ]; then
            test "$SCHEMA_DRIFT_RESULT" = "success"
          else
            test "$SCHEMA_DRIFT_RESULT" = "success" -o "$SCHEMA_DRIFT_RESULT" = "skipped"
          fi
          if [ "$EVENT_NAME" = "push" ] || [ "$NPM_CHANGED" = "true" ]; then
            test "$NPM_RESULT" = "success"
          else
            test "$NPM_RESULT" = "success" -o "$NPM_RESULT" = "skipped"
          fi

