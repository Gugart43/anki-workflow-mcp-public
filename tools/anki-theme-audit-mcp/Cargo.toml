[package]
name = "anki-theme-audit-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
schemars = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "anki-theme-audit-mcp"
path = "src/main.rs"
